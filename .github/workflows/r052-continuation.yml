name: R052 continuation exact public replay / R052 延续精确公开复演
on:
  push:
    paths:
      - 'certificates/R052-4.62003/**'
      - 'R052_4p62003_PUBLICATION.json'
      - 'README.md'
      - 'RESULTS.md'
      - 'CHANGELOG.md'
      - 'NOTICE.md'
      - 'CITATION.cff'
      - 'docs/**'
      - 'scripts/check_release_hashes.py'
      - 'verification/R052_4p62003.json'
      - '.github/workflows/r052-continuation.yml'
  pull_request:
    paths:
      - 'certificates/R052-4.62003/**'
      - 'R052_4p62003_PUBLICATION.json'
      - '.github/workflows/r052-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records-and-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out committed files / 检出已提交文件
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Python version / 显示 Python 版本
        run: python3 --version
      - name: Check frozen R052 records / 检查冻结 R052 记录
        run: python3 -X utf8 -B -S certificates/R052-4.62003/verify.py --output .replay-runs/r052-continuation-recorded-ci
      - name: Check publication hashes / 检查发布哈希
        run: python3 -X utf8 -B -S scripts/check_release_hashes.py
      - name: Recompute independent containment / 重算独立包含
        run: python3 -X utf8 -B -S certificates/R052-4.62003/verify.py --containment --output .replay-runs/r052-continuation-containment-ci
  native-full-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed files / 检出已提交文件
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install C++ and Boost headers / 安装C++和Boost头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev
      - name: Build and replay every native exact row / 构建并复演全部原生精确行
        run: python3 -X utf8 -B -S certificates/R052-4.62003/verify_native.py --jobs 4 --output .replay-runs/r052-continuation-native-ci
  bigint-full-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed files / 检出已提交文件
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js / 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Show runtime versions / 显示运行时版本
        run: |
          python3 --version
          node --version
      - name: Reconstruct checker and recompute all BigInt rows / 重建检查器并重算全部 BigInt 行
        run: python3 -X utf8 -B -S certificates/R052-4.62003/verify.py --bigint-full --jobs 5 --output .replay-runs/r052-continuation-bigint-ci
